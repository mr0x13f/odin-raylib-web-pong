name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build_linux:
    name: Linux
    runs-on: ubuntu-latest
    steps:
      - uses: laytan/setup-odin@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: mymindstorm/setup-emsdk@v14
      - uses: actions/checkout@v4
      - name: Install Linux dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev libglu1-mesa-dev libxcursor-dev libxinerama-dev libwayland-dev libxkbcommon-dev
      - name: Build debug
        run: sh build.sh debug
      - name: Build release
        run: sh build.sh release
      - name: Build web
        run: sh build.sh web
      - name: Upload web build artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  build_macos:
    name: MacOS
    runs-on: macos-latest
    steps:
      - uses: laytan/setup-odin@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: mymindstorm/setup-emsdk@v14
      - uses: actions/checkout@v4
      - name: Build debug
        run: sh build.sh debug
      - name: Build release
        run: sh build.sh release
      - name: Build web
        run: sh build.sh web

  build_windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: laytan/setup-odin@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: mymindstorm/setup-emsdk@v14
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Build debug
        run: sh build.sh debug
      - name: Build release
        run: sh build.sh release
      - name: Build web
        run: sh build.sh web

  deploy:
    name: Deploy GitHub Pages
    needs: build_linux
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
